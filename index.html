<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script>
const CONTENT_PATH = "/config/content.yml";
const PROJECTS_PATH = "/config/projects.yml";

async function loadYamlFile(path) {
  const response = await fetch(path, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`Konnte ${path} nicht laden: HTTP ${response.status}`);
  }
  return jsyaml.load(await response.text());
}

function setText(id, value) {
  const element = document.getElementById(id);
  if (element && value) {
    element.textContent = value;
  }
}

function setupScrollLinks() {
  const scrollLinks = document.querySelectorAll(".scroll");
  scrollLinks.forEach((link) => {
    link.addEventListener("click", (event) => {
      const href = link.getAttribute("href") || "";
      const hashIndex = href.indexOf("#");
      if (hashIndex === -1) return;

      const hash = href.slice(hashIndex);
      const target = document.querySelector(hash);
      if (!target) return;

      event.preventDefault();
      window.scrollTo({ top: target.offsetTop, behavior: "smooth" });
    });
  });
}

function buildYoutubeUrl(handle) {
  const normalized = String(handle || "").trim().replace(/^@/, "");
  return normalized ? `https://www.youtube.com/@${normalized}` : "";
}

function buildSubscribeUrl(handle) {
  const channelUrl = buildYoutubeUrl(handle);
  return channelUrl ? `${channelUrl}?sub_confirmation=1` : "";
}

function renderProjects(projects) {
  const container = document.getElementById("projects-list");
  const section = document.getElementById("projects");
  if (!container || !section) return;

  container.innerHTML = "";

  if (!Array.isArray(projects) || projects.length === 0) {
    section.style.display = "none";
    return;
  }

  projects.forEach(p => {
    const card = document.createElement("a");
    card.className = "main5_supporters_div main5_group_link main5_project_link";
    card.href = p.url || "#";
    card.style.setProperty("--rank-glow", p.glow_color || "#00d8ff");

    const image = document.createElement("img");
    image.className = "main5_supporters_img";
    image.src = p.image || "/media/placeholder.png";
    image.alt = p.name || "Projektbild";

    const textWrap = document.createElement("div");
    textWrap.className = "main5_supporters_description_div";

    const title = document.createElement("div");
    title.className = "main5_supporters_description_title";
    title.textContent = p.name || "Projekt";

    const description = document.createElement("div");
    description.className = "main5_supporters_description";
    description.textContent = p.description || "";

    textWrap.appendChild(title);
    textWrap.appendChild(description);
    card.appendChild(image);
    card.appendChild(textWrap);
    container.appendChild(card);
  });
}
  
function renderVideoActions(youtube) {
  const actions = document.getElementById("videos-actions");
  if (!actions) return;

  actions.innerHTML = "";
  const channelUrl = youtube.channel_url || buildYoutubeUrl(youtube.handle);
  const subscribeUrl = youtube.subscribe_url || buildSubscribeUrl(youtube.handle);

  [
    { href: channelUrl, label: youtube.channel_button_label || "Zum Kanal" },
    { href: subscribeUrl, label: youtube.subscribe_button_label || "Abonnieren", modifier: "subscribe" }
  ]
    .filter((entry) => entry.href)
    .forEach((entry) => {
      const link = document.createElement("a");
      link.className = "discord-widget__join youtube-widget__join";
      link.href = entry.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = entry.label;
      actions.appendChild(link);
    });
}

function applyHomepageConfig(cfg) {
  const site = cfg.site || {};
  const hero = cfg.hero || {};
  const sections = cfg.sections || {};
  const discord = cfg.discord || {};
  const youtube = cfg.youtube || {};
  const widget = document.getElementById("homepage-discord-widget");
  const communitySection = document.querySelector(".main4");

  if (site.title) {
    document.title = site.title;
  }

  setText("hero-accent", hero.accent);
  setText("hero-text", hero.text);
  setText("projects-heading", sections.projects_heading);
  setText("about-heading", sections.about_heading);
  setText("community-heading", sections.community_heading);
  setText("videos-heading", sections.videos_heading);
  setText("videos-intro", sections.videos_intro);
  setText("videos-channel-name", youtube.channel_name || youtube.handle || "YouTube");
  renderVideoActions(youtube);

  if (widget) {
    if (discord.server_id) {
      widget.dataset.serverId = discord.server_id;
    }
    if (discord.invite_url) {
      widget.dataset.inviteUrl = discord.invite_url;
    }
  }

  if (communitySection && !discord.server_id) {
    communitySection.style.display = "none";
  }

  if (widget && discord.server_id && window.DiscordWidget && typeof window.DiscordWidget.init === "function") {
    window.DiscordWidget.init(document);
  }
}

/* INIT */
async function init() {
  const cfg = (await loadYamlFile(CONTENT_PATH)) || {};
  applyHomepageConfig(cfg);
  setupScrollLinks();

  const projects = (await loadYamlFile(PROJECTS_PATH)) || [];
  renderProjects(Array.isArray(projects) ? projects : []);

  if (cfg.youtube && cfg.youtube.enabled === false) {
    const videosSection = document.getElementById("videos-section");
    if (videosSection) {
      videosSection.style.display = "none";
    }
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
