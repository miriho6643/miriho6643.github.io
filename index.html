<script>
const CONTENT_PATH = "/config/content.yml";
const handle = "miriho6643yt"; // DEIN HANDLE (ohne @)

/* PROJEKTE -> nutzt dein SUPPORTER Layout */
function renderProjects(projects) {
  const c = document.getElementById("projects");
  c.innerHTML = "";

  projects.forEach(p => {
    c.innerHTML += `
      <div class="main5_supporters_div", style="border-radius:20px;">
        <a href="${p.url}" target="_blank" class="main5_group_link">
          <img class="main5_supporters_img" src="${p.image}">
          <div class="main5_supporters_description_div">
            <div class="main5_supporters_description_title">${p.name}</div>
            <div class="main5_supporters_description">${p.description}</div>
          </div>
        </a>
      </div>
    `;
  });
}
  
// -------------------------
// YOUTUBE OHNE API / RSS
// -------------------------
async function getChannelVideos(channelHandle) {
  try {
    const url = `https://www.youtube.com/@${channelHandle}/videos`;

    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy);
    const data = await res.json();

    const html = data.contents;

    // Video IDs aus HTML extrahieren
    const ids = [...html.matchAll(/"videoId":"(.*?)"/g)]
      .map(m => m[1])
      .filter((v, i, a) => a.indexOf(v) === i) // duplicates raus
      .slice(0, 4);

    return ids.map(id => ({
      id,
      link: `https://www.youtube.com/watch?v=${id}`,
      thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`
    }));

  } catch (err) {
    console.error("YT Fehler:", err);
    return [];
  }
}

// -------------------------
// RENDER (dein System)
// -------------------------
function renderVideos(videos) {
  const c = document.getElementById("yt-videos");
  c.innerHTML = "";

  videos.forEach(v => {
    c.innerHTML += `
      <div class="main2_feature">
        <a href="${v.link}" target="_blank">
          <img class="main2_feature_img" src="${v.thumb}">
          <div class="main2_feature_headline">Video</div>
          <div class="main2_feature_text">${v.id}</div>
        </a>
      </div>
    `;
  });
}

/* INIT */
async function init() {
  const cfg = jsyaml.load(await (await fetch(CONTENT_PATH)).text());

  if (cfg.projects) {
    renderProjects(cfg.projects);
  }
  
  if (cfg.handle) {
    const vids = await getChannelVideos(handle);
    renderVideos(vids);
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
