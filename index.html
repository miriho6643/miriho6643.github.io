<!-- IP SYSTEM (DEIN CODE) -->
<!-- ========================= -->
<script>
window.CURRENT_IP = "";
const IP_CONFIG_PATH = "/config/ip.yml";

async function loadIpConfig() {
  const res = await fetch(IP_CONFIG_PATH);
  return jsyaml.load(await res.text());
}

async function loadCurrentIp() {
  const config = await loadIpConfig();
  window.CURRENT_IP = config.fixed_ip || "Keine IP";

  document.querySelectorAll('[data-ip-target]').forEach(el => {
    el.textContent = window.CURRENT_IP;
  });
}

function copyText() {
  navigator.clipboard.writeText(window.CURRENT_IP);
}

document.addEventListener("DOMContentLoaded", loadCurrentIp);
</script>

<!-- CONTENT SYSTEM -->
<!-- ========================= -->
<script>
// -------------------------
// YOUTUBE OHNE API (RSS)
// -------------------------
async function loadVideosRSS(channelId) {
  const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`;

  const res = await fetch(proxy);
  if (!res.ok) throw new Error("RSS konnte nicht geladen werden");

  const data = await res.json();

  const parser = new DOMParser();
  const xml = parser.parseFromString(data.contents, "text/xml");

  const entries = [...xml.querySelectorAll("entry")].slice(0, 4);

  return entries.map(entry => ({
    title: entry.querySelector("title").textContent,
    link: entry.querySelector("link").getAttribute("href"),
    thumbnail: entry.querySelector("media\\:thumbnail").getAttribute("url")
  }));
}

function renderVideos(videos) {
  const container = document.getElementById("yt-videos");
  container.innerHTML = "";

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card">
        <a href="${v.link}" target="_blank">
          <img src="${v.thumbnail}">
          <p>${v.title}</p>
        </a>
      </div>
    `;
  });
}

// INIT (ersetzt deinen alten YouTube Teil)
async function initYouTube(channelId) {
  try {
    const videos = await loadVideosRSS(channelId);
    renderVideos(videos);
  } catch (err) {
    console.error("YT RSS Fehler:", err);
  }
}
</script>
